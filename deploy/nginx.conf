# ============================================================
# Nginx — SecretarIA
# Arquivo: /etc/nginx/sites-available/secretaria
# ============================================================
# Substitua SEU_DOMINIO.com pelo seu domínio real

server {
    listen 80;
    server_name SEU_DOMINIO.com www.SEU_DOMINIO.com;

    # Redireciona tudo para HTTPS (o Certbot configura isso automaticamente)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name SEU_DOMINIO.com www.SEU_DOMINIO.com;

    # Certificado SSL (gerado pelo Certbot — não mexa)
    ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # ── Frontend React (arquivos estáticos) ──────────────────
    root /var/www/secretaria/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;  # Necessário para React Router
    }

    # Cache de assets (JS/CSS com hash no nome)
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Backend Node.js (proxy reverso) ─────────────────────
    # Toda rota /api/* e /webhooks/* vai para o Node na porta 3001
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    location /webhooks/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Tamanho máximo de upload (para imagens via WhatsApp)
    client_max_body_size 20M;
}
